name: Offline CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline:
    name: Node 24 offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_ALLOW_CLOUD: '0'
      AGENT_AUTH_DIR: ${{ github.workspace }}/.ci-auth
      CHATGPT_MODEL: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_GENERATIVE_AI_API_KEY: ''
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # test:core includes all v2/v3 *.test.ts files, including closure tests.
      - name: Core and provider contract tests
        run: npm run test:core

      # These suites share the checkout's registry and grant store: run in order.
      - name: Durable approval integration
        run: npm run test:integration

      - name: Registry and grants integration
        run: npm run test:v2:integration

      - name: Sequential planner integration
        run: npm run test:v3:integration
